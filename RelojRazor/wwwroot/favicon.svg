<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dominican Watch Men — favicon de marca -->
  <defs>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A84C"/>
      <stop offset="1" stop-color="#B8922A"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado (tinta) -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#111110"/>

  <!-- Corona de la relojeria (arriba) -->
  <rect x="29" y="4" width="6" height="7" rx="1.5" fill="url(#oro)"/>

  <!-- Bisel exterior -->
  <circle cx="32" cy="34" r="22" fill="none" stroke="url(#oro)" stroke-width="3"/>
  <!-- Esfera -->
  <circle cx="32" cy="34" r="18" fill="#1A1917" stroke="#3A3835" stroke-width="1"/>

  <!-- Marcadores 12 / 3 / 6 / 9 -->
  <g fill="url(#oro)">
    <rect x="30.5" y="18" width="3" height="5" rx="1"/>
    <rect x="30.5" y="45" width="3" height="5" rx="1"/>
    <rect x="16" y="32.5" width="5" height="3" rx="1"/>
    <rect x="43" y="32.5" width="5" height="3" rx="1"/>
  </g>

  <!-- Manecillas -->
  <line x1="32" y1="34" x2="32" y2="23" stroke="url(#oro)" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="32" y1="34" x2="41" y2="38" stroke="#F5ECD5" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Eje central -->
  <circle cx="32" cy="34" r="2.4" fill="url(#oro)"/>
</svg>
